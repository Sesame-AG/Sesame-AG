name: Sesame-AG 第三方构建
run-name: 构建任务 - ${{ github.event_name }}
on:
  push:
    branches:
      - dev
    tags:
      - '[0-9]*-*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'
env:
  CI: "true"
  JAVA_DISTRIBUTION: "temurin"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "37"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  RELEASE_DIR: "app/build/outputs/apk/release"
  STAGING_DIR: "app/build/outputs/apk/all"
  ASSET_DIR: "app/build/outputs/apk/release-assets"
  TARGET_SOURCE_BRANCH: "dev"
  UPSTREAM_REPO: "Sesame-AG/Sesame-AG"
  UPSTREAM_BRANCH: "dev"
  UPSTREAM_MAIN_BRANCH: "main"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
concurrency:
  group: sesame-build
  cancel-in-progress: false
jobs:
  sync-dev:
    name: "🔄 同步上游 dev 分支"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    outputs:
      dev_updated: ${{ steps.sync.outputs.dev_updated }}
      change_log: ${{ steps.sync.outputs.change_log }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          ref: main
      - name: 配置 Git 与上游
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream "${{ env.UPSTREAM_BRANCH }}" --quiet
      - name: 合并上游 dev 分支
        id: sync
        run: |
          if git rev-parse --verify --quiet "origin/${{ env.TARGET_SOURCE_BRANCH }}" >/dev/null; then
            git checkout -B "${{ env.TARGET_SOURCE_BRANCH }}" "origin/${{ env.TARGET_SOURCE_BRANCH }}"
          else
            git checkout -B "${{ env.TARGET_SOURCE_BRANCH }}" origin/main
          fi
          if git merge-base --is-ancestor "upstream/${{ env.UPSTREAM_BRANCH }}" HEAD; then
            echo "dev_updated=false" >> "$GITHUB_OUTPUT"
            echo "change_log=" >> "$GITHUB_OUTPUT"
            echo "ℹ️ dev 分支无更新"
            exit 0
          fi
          BEFORE_SHA="$(git rev-parse HEAD)"
          git merge "upstream/${{ env.UPSTREAM_BRANCH }}" --no-commit --no-ff -X theirs || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "❌ 合并上游产生冲突，终止任务"
            exit 1
          fi
          rm -rf .github/workflows
          git checkout "${BEFORE_SHA}" -- .github/workflows 2>/dev/null || true
          git add -A
          git commit -m "Merge upstream/${{ env.UPSTREAM_BRANCH }} [skip ci]" || true
          AFTER_SHA="$(git rev-parse HEAD)"
          CHANGE_LOG="$(git log --oneline "${BEFORE_SHA}..${AFTER_SHA}")"
          echo "dev_updated=true" >> "$GITHUB_OUTPUT"
          echo "change_log<<CHANGE_LOG_EOF" >> "$GITHUB_OUTPUT"
          echo "${CHANGE_LOG}" >> "$GITHUB_OUTPUT"
          echo "CHANGE_LOG_EOF" >> "$GITHUB_OUTPUT"
          git push origin "${{ env.TARGET_SOURCE_BRANCH }}" --force-with-lease
          echo "✅ dev 分支已同步并推送"
  sync-main:
    name: "🔄 同步上游 main 分支"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          ref: main
      - name: 配置 Git 与上游
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream "${{ env.UPSTREAM_MAIN_BRANCH }}" --quiet
      - name: 合并上游 main 分支
        run: |
          git checkout -B main origin/main
          if git merge-base --is-ancestor "upstream/${{ env.UPSTREAM_MAIN_BRANCH }}" HEAD; then
            echo "ℹ️ main 分支无更新"
            exit 0
          fi
          BEFORE_SHA="$(git rev-parse HEAD)"
          git merge "upstream/${{ env.UPSTREAM_MAIN_BRANCH }}" --no-commit --no-ff -X theirs || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "⚠️ main分支合并冲突，跳过本次合并"
            exit 1
          fi
          rm -rf .github/workflows
          git checkout "${BEFORE_SHA}" -- .github/workflows 2>/dev/null || true
          git add -A
          git commit -m "Merge upstream/${{ env.UPSTREAM_MAIN_BRANCH }} [skip ci]" || true
          git push origin main --force-with-lease
          echo "✅ main 分支已同步并推送"
  build-and-release:
    name: "📦 编译签名发布 APK"
    runs-on: ubuntu-latest
    needs: sync-dev
    permissions:
      contents: write
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        needs.sync-dev.outputs.dev_updated == 'true'
      )
    outputs:
      version: ${{ steps.prepare_assets.outputs.version }}
      tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
      dev_commit: ${{ steps.upstream_info.outputs.dev_commit }}
      main_commit: ${{ steps.upstream_info.outputs.main_commit }}
    steps:
      - name: 判断检出ref
        id: pick-ref
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${{ env.TARGET_SOURCE_BRANCH }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 检出待构建代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.pick-ref.outputs.checkout_ref }}
      - name: 设置时区
        run: echo "TZ=Asia/Shanghai" >> "$GITHUB_ENV"
      - name: 安装 JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
      - name: 配置 Gradle Java Home
        run: echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: 安装 Android SDK 组件
        run: |
          sdkmanager --install "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-cleanup: on-success
      - name: 赋予 Gradle 执行权限
        run: chmod +x gradlew
      - name: 执行 Release 构建
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: 准备待签名的 APK
        run: |
          rm -rf "${STAGING_DIR}" "${ASSET_DIR}"
          mkdir -p "${STAGING_DIR}"
          find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*.apk" -exec cp {} "${STAGING_DIR}/" \;
          if [ -z "$(ls -A ${STAGING_DIR})" ]; then
            echo "❌ 未找到任何 APK 文件"
            exit 1
          fi
      - name: 对 APK 进行签名
        id: sign_apks
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: ${{ env.STAGING_DIR }}
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: ${{ env.ANDROID_BUILD_TOOLS }}
      - name: 规范化文件名与版本号提取
        id: prepare_assets
        run: |
          mkdir -p "${ASSET_DIR}"
          IFS=':' read -r -a files <<< "${{ steps.sign_apks.outputs.signedFiles }}"
          for file in "${files[@]}"; do
            [ -n "${file}" ] || continue
            base="$(basename "${file}")"
            abi="universal"
            for candidate in arm64-v8a armeabi-v7a x86_64 x86; do
              if [[ "${base}" == *"${candidate}"* ]]; then abi="${candidate}"; break; fi
            done
            cp "${file}" "${ASSET_DIR}/app-${abi}-release-signed.apk"
          done
          cd "${ASSET_DIR}"
          sha256sum -- *.apk > SHA256SUMS
          VERSION="$(grep '^appVersion=' app/gradle.properties 2>/dev/null | head -n 1 | cut -d'=' -f 2 | tr -d '[:space:]')"
          if [ -z "${VERSION}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            if [[ "${TAG_NAME}" =~ ^[0-9]+-(.+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
            fi
          fi
          if [ -z "${VERSION}" ]; then
            git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git" 2>/dev/null || true
            git fetch upstream --tags --quiet 2>/dev/null || true
            LATEST_TAG="$(git describe --tags --abbrev=0 "upstream/${{ env.UPSTREAM_BRANCH }}" 2>/dev/null || true)"
            if [[ "${LATEST_TAG}" =~ ^[0-9]+-(.+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
            fi
          fi
          if [ -z "${VERSION}" ]; then VERSION="0.0.0"; fi
          SHORT_SHA="$(git rev-parse --short HEAD 2>/dev/null || echo "0000000")"
          DATE="$(date '+%Y%m%d')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION}-${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "✅ 解析到的版本号为: ${VERSION}"
      - name: 获取原仓库最新提交信息
        id: upstream_info
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream --quiet
          if git rev-parse --short upstream/dev >/dev/null 2>&1; then
            DEV_SHA="$(git rev-parse --short upstream/dev)"
            DEV_MSG="$(git log --oneline -1 upstream/dev | cut -d' ' -f2-)"
          else
            DEV_SHA="N/A"
            DEV_MSG="无"
          fi
          MAIN_SHA="$(git rev-parse --short upstream/main)"
          MAIN_MSG="$(git log --oneline -1 upstream/main | cut -d' ' -f2-)"
          echo "dev_commit=${DEV_SHA} - ${DEV_MSG}" >> "$GITHUB_OUTPUT"
          echo "main_commit=${MAIN_SHA} - ${MAIN_MSG}" >> "$GITHUB_OUTPUT"
      - name: 生成 Release 说明文件
        run: |
          cat > release-body.md << 'BODY_EOF'
          ## 📦 构建信息
          BODY_EOF
          echo "- 版本号：v${{ steps.prepare_assets.outputs.version }}" >> release-body.md
          echo "- 构建时间：$(date '+%Y-%m-%d %H:%M:%S')" >> release-body.md
          echo "" >> release-body.md
          echo "## 📝 原仓库最新提交" >> release-body.md
          echo "- **dev**: ${{ steps.upstream_info.outputs.dev_commit }}" >> release-body.md
          echo "- **main**: ${{ steps.upstream_info.outputs.main_commit }}" >> release-body.md
          if [ "${{ needs.sync-dev.outputs.dev_updated }}" == "true" ]; then
            echo "" >> release-body.md
            echo "## 📥 本次同步更新记录" >> release-body.md
            printf '%s\n' "${{ needs.sync-dev.outputs.change_log }}" | while read -r line; do
              if [ -n "$line" ]; then echo "- $line" >> release-body.md; fi
            done
          fi
          cat >> release-body.md << 'BODY_EOF'
          ## 📱 下载说明
          - `universal`: 通用版（推荐，适用所有设备）
          - `arm64-v8a`: 64位 ARM 设备（主流新手机）
          - `armeabi-v7a`: 32位 ARM 设备（旧款手机）
          - `x86_64` / `x86`: 安卓模拟器
          BODY_EOF
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
          name: Sesame-AG v${{ steps.prepare_assets.outputs.version }}
          make_latest: true
          generate_release_notes: false
          body_path: release-body.md
          files: |
            ${{ env.ASSET_DIR }}/*.apk
            ${{ env.ASSET_DIR }}/SHA256SUMS
      - name: 清理旧版本（保留最近 3 个）
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          releases="$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPO}/releases?per_page=100" | jq -r '.[] | select(.tag_name | startswith("v")) | "\(.id) \(.tag_name)"' | sort -r)"
          count="$(printf '%s\n' "${releases}" | sed '/^$/d' | wc -l)"
          delete_count=$((count - 3))
          if [ "${delete_count}" -le 0 ]; then exit 0; fi
          printf '%s\n' "${releases}" | tail -n "${delete_count}" | while read -r release_id tag_name; do
            curl -sS -f -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPO}/releases/${release_id}" || true
            curl -sS -f -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPO}/git/refs/tags/${tag_name}" || true
          done
  notify-email:
    name: "📧 邮件通知构建结果"
    runs-on: ubuntu-latest
    needs: [ sync-dev, build-and-release ]
    if: always() && needs.build-and-release.result != 'skipped' && needs.build-and-release.result != 'cancelled'
    steps:
      - name: 准备邮件内容
        id: gen_email
        run: |
          if [ "${{ needs.build-and-release.result }}" == "success" ]; then
            SUBJECT="✅ Sesame-AG 构建成功 (v${{ needs.build-and-release.outputs.version }})"
            {
              echo "🎉 Sesame-AG 新版本已成功构建并发布！"
              echo ""
              echo "🔗 下载地址：${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.build-and-release.outputs.tag_name }}"
              echo ""
              echo "📦 版本信息：v${{ needs.build-and-release.outputs.version }}"
              echo ""
              echo "📝 原仓库最新提交"
              echo "- dev: ${{ needs.build-and-release.outputs.dev_commit }}"
              echo "- main: ${{ needs.build-and-release.outputs.main_commit }}"
            } > email-body.txt
          else
            SUBJECT="❌ Sesame-AG 构建失败"
            {
              echo "❌ Sesame-AG 构建流程出现失败。"
              echo ""
              echo "🔗 错误日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > email-body.txt
          fi
          if [ "${{ needs.sync-dev.outputs.dev_updated }}" == "true" ]; then
            echo "" >> email-body.txt
            echo "📥 本次同步的全部提交：" >> email-body.txt
            printf '%s\n' "${{ needs.sync-dev.outputs.change_log }}" | while read -r line; do
              if [ -n "$line" ]; then echo "- $line" >> email-body.txt; fi
            done
          fi
          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"
      - name: 发送邮件
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: GitHub Actions 自动构建
          subject: ${{ steps.gen_email.outputs.subject }}
          body: file://email-body.txt
  notify-failure:
    name: "⚠️ 失败摘要输出"
    runs-on: ubuntu-latest
    needs: [ sync-dev, sync-main, build-and-release ]
    if: failure() || cancelled()
    steps:
      - name: 输出失败提示
        run: |
          echo "## ❌ 构建执行失败" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "请点击左侧失败的任务步骤，查看详细日志信息。" >> "$GITHUB_STEP_SUMMARY"
