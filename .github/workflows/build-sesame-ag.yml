name: Sesame-AG 第三方构建

run-name: 构建任务 - ${{ github.event_name }}

on:
  push:
分支:
      - dev
标签:
      - '[0-9]*-*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

env:
  CI: "true"
  JAVA_DISTRIBUTION: "oracle"
  JAVA_VERSION: "17.0.1"
  ANDROID_API_LEVEL: "37"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  LOCAL_GRADLE_VERSION: "9.5.1"
  LOCAL_AGP_VERSION: "9.2.1"
  LOCAL_KOTLIN_VERSION: "2.2.10"
  RELEASE_DIR: app/build/outputs/apk/release
  STAGING_DIR: app/build/outputs/apk/all
  ASSET_DIR: app/build/outputs/apk/release-assets
  TARGET_SOURCE_BRANCH: dev
  UPSTREAM_REPO: Sesame-AG/Sesame-AG
  UPSTREAM_BRANCH: dev
  UPSTREAM_MAIN_BRANCH: main
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: sesame-build
  cancel-in-progress: false

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    outputs:
      dev_updated: ${{ steps.sync.outputs.dev_updated }}
      change_log: ${{ steps.sync.outputs.change_log }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          ref: main
      - name: Config Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
      - name: Fetch Upstream Dev
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream "${{ env.UPSTREAM_BRANCH }}" --quiet
      - name: Sync Dev
        id: sync
        run: |
          if git rev-parse --verify --quiet "origin/${{ env.TARGET_SOURCE_BRANCH }}" >/dev/null; then
            git checkout -B "${{ env.TARGET_SOURCE_BRANCH }}" "origin/${{ env.TARGET_SOURCE_BRANCH }}"
          else
            git checkout -B "${{ env.TARGET_SOURCE_BRANCH }}" origin/main
          fi
          if git merge-base --is-ancestor "upstream/${{ env.UPSTREAM_BRANCH }}" HEAD; then
            echo "dev_updated=false" >> "$GITHUB_OUTPUT"
            echo "change_log=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE_SHA="$(git rev-parse HEAD)"
          git merge "upstream/${{ env.UPSTREAM_BRANCH }}" --no-commit --no-ff -X theirs || true
          rm -rf .github/workflows
          git checkout "${BEFORE_SHA}" -- .github/workflows 2>/dev/null || true
          git add -A
          git commit -m "Merge upstream/${{ env.UPSTREAM_BRANCH }} [skip ci]" || true
          AFTER_SHA="$(git rev-parse HEAD)"
          CHANGE_LOG="$(git log --oneline "${BEFORE_SHA}..${AFTER_SHA}")"
          echo "dev_updated=true" >> "$GITHUB_OUTPUT"
          echo "change_log<<CHANGE_LOG_EOF" >> "$GITHUB_OUTPUT"
          echo "${CHANGE_LOG}" >> "$GITHUB_OUTPUT"
          echo "CHANGE_LOG_EOF" >> "$GITHUB_OUTPUT"
          git push origin "${{ env.TARGET_SOURCE_BRANCH }}" --force-with-lease

  sync-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    outputs:
      main_updated: ${{ steps.sync.outputs.main_updated }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          ref: main
      - name: Config Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
      - name: Fetch Upstream Main
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream "${{ env.UPSTREAM_MAIN_BRANCH }}" --quiet
      - name: Sync Main
        id: sync
        run: |
          git checkout -B main origin/main
          if git merge-base --is-ancestor "upstream/${{ env.UPSTREAM_MAIN_BRANCH }}" HEAD; then
            echo "main_updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE_SHA="$(git rev-parse HEAD)"
          git merge "upstream/${{ env.UPSTREAM_MAIN_BRANCH }}" --no-commit --no-ff -X theirs || true
          rm -rf .github/workflows
          git checkout "${BEFORE_SHA}" -- .github/workflows 2>/dev/null || true
          git add -A
          git commit -m "Merge upstream/${{ env.UPSTREAM_MAIN_BRANCH }} [skip ci]" || true
          echo "main_updated=true" >> "$GITHUB_OUTPUT"
          git push origin main --force-with-lease

  build-and-release:
    runs-on: ubuntu-latest
    needs: sync-dev
    permissions:
      contents: write
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch' || needs.sync-dev.outputs.dev_updated == 'true')
    outputs:
      version: ${{ steps.prepare_assets.outputs.version }}
      tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
      build_time: ${{ steps.prepare_assets.outputs.build_time }}
      dev_latest_commit: ${{ steps.prepare_assets.outputs.dev_latest_commit }}
      dev_latest_commit_msg: ${{ steps.prepare_assets.outputs.dev_latest_commit_msg }}
      dev_latest_commit_time: ${{ steps.prepare_assets.outputs.dev_latest_commit_time }}
      main_latest_commit: ${{ steps.prepare_assets.outputs.main_latest_commit }}
      main_latest_commit_msg: ${{ steps.prepare_assets.outputs.main_latest_commit_msg }}
      main_latest_commit_time: ${{ steps.prepare_assets.outputs.main_latest_commit_time }}
    steps:
      - name: Set Timezone
        run: sudo timedatectl set-timezone Asia/Shanghai
      - name: Checkout Build Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref || env.TARGET_SOURCE_BRANCH }}
      - name: Wait Random
        if: github.event_name == 'schedule'
        run: |
          WAIT_SEC=$((RANDOM % 7200))
          sleep "${WAIT_SEC}"
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
      - name: Set Gradle Java Home
        run: echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-cleanup: on-success
      - name: Chmod Gradle
        run: chmod +x gradlew
      - name: Check Toolchain
        run: |
          grep -Eq '^distributionUrl=.*gradle-'"${LOCAL_GRADLE_VERSION//./\\.}"'-bin\.zip$' gradle/wrapper/gradle-wrapper.properties
          grep -Eq '^android-plugin = "'"${LOCAL_AGP_VERSION//./\\.}"'"$' gradle/libs.versions.toml
          grep -Eq '^kotlin = "'"${LOCAL_KOTLIN_VERSION//./\\.}"'"$' gradle/libs.versions.toml
          grep -Eq '^appVersion=.+' gradle.properties
          grep -Eq 'compileSdk = '"${ANDROID_API_LEVEL}"'$' app/build.gradle.kts
          grep -Eq 'buildToolsVersion = "'"${ANDROID_BUILD_TOOLS//./\\.}"'"$' app/build.gradle.kts
      - name: Build Release
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Stage APKs
        run: |
          rm -rf "${STAGING_DIR}" "${ASSET_DIR}"
          mkdir -p "${STAGING_DIR}"
          mapfile -t apks < <(find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*.apk" | sort)
          if [ "${#apks[@]}" -eq 0 ]; then exit 1; fi
          cp "${apks[@]}" "${STAGING_DIR}/"
      - name: Sign APKs
        id: sign_apks
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: ${{ env.STAGING_DIR }}
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: ${{ env.ANDROID_BUILD_TOOLS }}
      - name: Prepare Assets
        id: prepare_assets
        run: |
          rm -rf "${ASSET_DIR}"
          mkdir -p "${ASSET_DIR}"
          IFS=':' read -r -a files <<< "${{ steps.sign_apks.outputs.signedFiles }}"
          for file in "${files[@]}"; do
            [ -n "${file}" ] || continue
            base="$(basename "${file}")"
            abi="universal"
            for candidate in arm64-v8a armeabi-v7a x86_64 x86; do
              if [[ "${base}" == *"${candidate}"* ]]; then abi="${candidate}"; break; fi
            done
            cp "${file}" "${ASSET_DIR}/app-${abi}-release-signed.apk"
          done
          cd "${ASSET_DIR}"
          sha256sum -- *.apk > SHA256SUMS
          VERSION="$(sed -n 's/^appVersion=//p' gradle.properties | head -n1 | tr -d '\r')"
          if [ -z "${VERSION}" ]; then VERSION="0.0.0"; fi
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date '+%Y%m%d')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION}-${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream --quiet
          if git rev-parse --short upstream/dev >/dev/null 2>&1; then
            echo "dev_latest_commit=$(git rev-parse --short upstream/dev)" >> "$GITHUB_OUTPUT"
            echo "dev_latest_commit_msg=$(git log --oneline -1 upstream/dev | cut -d' ' -f2-)" >> "$GITHUB_OUTPUT"
            echo "dev_latest_commit_time=$(git log -1 --format='%ci' upstream/dev)" >> "$GITHUB_OUTPUT"
          else
            echo "dev_latest_commit=N/A" >> "$GITHUB_OUTPUT"
            echo "dev_latest_commit_msg=N/A" >> "$GITHUB_OUTPUT"
            echo "dev_latest_commit_time=N/A" >> "$GITHUB_OUTPUT"
          fi
          echo "main_latest_commit=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          echo "main_latest_commit_msg=$(git log --oneline -1 upstream/main | cut -d' ' -f2-)" >> "$GITHUB_OUTPUT"
          echo "main_latest_commit_time=$(git log -1 --format='%ci' upstream/main)" >> "$GITHUB_OUTPUT"
      - name: Gen Release Body
        run: |
          cat > release-body.md << 'BODY_EOF'
          ## Build Info
          BODY_EOF
          echo "- Version: v${{ steps.prepare_assets.outputs.version }}" >> release-body.md
          echo "- Build Time: ${{ steps.prepare_assets.outputs.build_time }}" >> release-body.md
          echo "" >> release-body.md
          echo "## Upstream Commits" >> release-body.md
          echo "- dev: ${{ steps.prepare_assets.outputs.dev_latest_commit }}" >> release-body.md
          echo "- main: ${{ steps.prepare_assets.outputs.main_latest_commit }}" >> release-body.md
          if [ "${{ needs.sync-dev.outputs.dev_updated }}" == "true" ]; then
            echo "" >> release-body.md
            echo "## Changes" >> release-body.md
            printf '%s\n' "${{ needs.sync-dev.outputs.change_log }}" | while read -r line; do [ -n "$line" ] && echo "- $line" >> release-body.md; done
          fi
          cat >> release-body.md << 'BODY_EOF'

          ## Downloads
          - `universal`: Recommended for all devices.
          - `arm64-v8a`: 64-bit ARM devices.
          - `armeabi-v7a`: 32-bit ARM devices.
          BODY_EOF
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
          name: Sesame-AG v${{ steps.prepare_assets.outputs.version }}
          make_latest: true
          generate_release_notes: false
          body_path: release-body.md
          files: |
            ${{ env.ASSET_DIR }}/*.apk
            ${{ env.ASSET_DIR }}/*.sha256
            ${{ env.ASSET_DIR }}/SHA256SUMS
      - name: Clean Old Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          releases="$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPO}/releases?per_page=100" | jq -r '.[] | select(.tag_name | startswith("v")) | "\(.id) \(.tag_name)"' | sort -r)"
          count="$(printf '%s\n' "${releases}" | sed '/^$/d' | wc -l)"
          delete_count=$((count - 3))
          if [ "${delete_count}" -le 0 ]; then exit 0; fi
          printf '%s\n' "${releases}" | tail -n "${delete_count}" | while read -r release_id tag_name; do
            curl -sS -f -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPO}/releases/${release_id}" || true
            curl -sS -f -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPO}/git/refs/tags/${tag_name}" || true
          done

  notify-email:
    runs-on: ubuntu-latest
    needs: [ sync-dev, build-and-release ]
    if: always() && needs.build-and-release.result != 'skipped' && needs.build-and-release.result != 'cancelled'
    steps:
      - name: Gen Email Body
        id: gen_email
        run: |
          if [ "${{ needs.build-and-release.result }}" == "success" ]; then
            SUBJECT="Success: Sesame-AG Build"
            echo "Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > email-body.txt
            echo "Version: ${{ needs.build-and-release.outputs.version }}" >> email-body.txt
          else
            SUBJECT="Failed: Sesame-AG Build"
            echo "Build Failed. Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > email-body.txt
          fi
          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"
      - name: Send Mail
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: GitHub Actions
          subject: ${{ steps.gen_email.outputs.subject }}
          body: file://email-body.txt

  notify-failure:
    runs-on: ubuntu-latest
    needs: [ sync-dev, sync-main, build-and-release ]
    if: failure()
    steps:
      - name: Print Error
        run: echo "Build Failed"
