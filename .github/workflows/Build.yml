name: Build Sesame-AG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
        distribution: 'temurin' # 推荐使用 Temurin，规避旧版 OpenJDK 的 cgroups 解析缺陷
        java-version: '17.0.11' # 指定修复后的较新补丁版本
        cache: gradle

      # 关键修改：直接用 ./gradlew 构建，不要额外指定 Gradle 版本
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-APK
          path: app/build/outputs/apk/debug/*.apk
