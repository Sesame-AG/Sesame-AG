name: Fork Build

on:
  workflow_dispatch:

env:
  CI: "true"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "37"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Build release APKs with debug signing
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fork-output
          find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -exec cp {} fork-output/ \;
          test "$(find fork-output -maxdepth 1 -type f -name '*.apk' | wc -l)" -gt 0

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: Sesame-AG-fork-${{ github.run_number }}
          path: fork-output/*.apk
          if-no-files-found: error
